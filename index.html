<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shashank — portfolio</title>

<!-- The site currently is the scroll-scrub landing prototype. This root page
     forwards to it so the bare Pages URL works; replace it once the real
     landing page lands here. -->
<link rel="canonical" href="prototype/">
<meta http-equiv="refresh" content="0; url=prototype/">
<!-- Carries the query and hash across. Without this a link like
     ?autoscrub=1 or #sx-work is silently dropped on the way to the
     prototype, which makes every parameter the page reads unreachable
     from the bare Pages URL. The meta refresh above cannot do this, so
     it stays as the no-JS fallback and lands on the plain path. -->
<script>location.replace("prototype/" + location.search + location.hash);</script>

<style>
  html { background: #000; color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #8b8781;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: .9rem; letter-spacing: .02em;
  }
  a { color: #ff5c2b; }
</style>
</head>
<body>
  <p>Loading the <a href="prototype/">prototype</a>&hellip;</p>
</body>
</html>
