<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shashank — portfolio</title>

<!-- The site currently is the scroll-scrub landing prototype. This root page
     forwards to it so the bare Pages URL works; replace it once the real
     landing page lands here. -->
<link rel="canonical" href="prototype/">

<!-- ORDER MATTERS HERE, and it is the whole reason this is three lines rather
     than one.

     The script carries the query and hash across: without it a link like
     ?autoscrub=1 or #sx-work is silently dropped on the way to the prototype,
     which makes every parameter the page reads unreachable from the bare Pages
     URL. A meta refresh cannot do that — its target is a static string.

     So the script has to WIN, and it only wins if it is parsed first. A
     `refresh` of 0 is acted on the moment it is parsed, which beat this script
     to the navigation and landed on the bare path with the parameter gone.
     Putting the script above the meta fixes the order; giving the meta a 1s
     delay removes the race entirely rather than relying on winning it.

     The meta therefore does one job only: redirecting a browser with JS turned
     off, a second later. With JS on it never fires, because the script has
     already navigated. The body's own link is the third fallback, for anyone
     the meta does not reach either. -->
<script>location.replace("prototype/" + location.search + location.hash);</script>
<meta http-equiv="refresh" content="1; url=prototype/">

<style>
  html { background: #000; color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #8b8781;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: .9rem; letter-spacing: .02em;
  }
  a { color: #ff5c2b; }
</style>
</head>
<body>
  <p>Loading the <a href="prototype/">prototype</a>&hellip;</p>
</body>
</html>
